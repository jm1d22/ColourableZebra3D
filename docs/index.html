<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zebra Texture Viewer</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <style>
        body { margin: 0; padding: 0; display: flex; font-family: sans-serif; background: #1a1a1a; color: #fff; }
        #sidebar { width: 320px; padding: 20px; background: #252525; height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; gap: 15px; }
        #renderCanvas { flex: 1; height: 100vh; touch-action: none; outline: none; }
        input, select, button { width: 100%; padding: 10px; background: #333; color: #fff; border: 1px solid #444; border-radius: 4px; box-sizing: border-box; }
        button { cursor: pointer; font-weight: bold; background: #007acc; border: none; }
        button:hover { background: #005999; }
        button.secondary { background: #444; }
        button.secondary:hover { background: #555; }
        .anim-group { display: flex; gap: 10px; }
        #log { background: #000; font-family: monospace; font-size: 11px; padding: 10px; height: 120px; overflow-y: auto; color: #00ff00; border-radius: 4px; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Zebra Texture Viewer</h2>
        
        <div>
            <label>Search Zebra:</label>
            <input type="text" id="searchInput" placeholder="Type Zebra name...">
        </div>

        <div>
            <label>Select your Zebra:</label>
            <select id="textureSelect" size="5"></select>
        </div>

        <button id="toggleModelBtn" class="secondary">Mode: Low-Poly (Static)</button>

        <div id="animControls" style="display: none;">
            <label>Animation Controls:</label>
            <div class="anim-group">
                <button id="playBtn">Play</button>
                <button id="pauseBtn">Pause</button>
            </div>
        </div>

        <div id="log">Initializing...</div>
    </div>

    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        let scene, currentMesh = null, activeAnimGroup = null;

        // State variables
        let isHighPolyMode = false;
        let selectedZebraName = "";
        let availableZebras = [];

        function log(msg) {
            const l = document.getElementById("log");
            l.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
            l.scrollTop = l.scrollHeight;
        }

        const createScene = function () {
            const s = new BABYLON.Scene(engine);
            s.clearColor = new BABYLON.Color4(0.1, 0.1, 0.1, 1.0);

            const camera = new BABYLON.ArcRotateCamera("camera", Math.PI / 2, Math.PI / 3, 3, new BABYLON.Vector3(0, 0.5, 0), s);
            camera.attachControl(canvas, true);
            camera.wheelPrecision = 50;

            const light1 = new BABYLON.HemisphericLight("light1", new BABYLON.Vector3(0, 1, 0), s);
            light1.intensity = 1.2;
            const light2 = new BABYLON.DirectionalLight("light2", new BABYLON.Vector3(-1, -2, -1), s);
            light2.intensity = 0.8;

            return s;
        };

        scene = createScene();

        async function fetchTexturesList() {
            try {
                // Fetch list from repo contents API or fallback local array
                const response = await fetch("https://api.github.com/repos/jm1d22/ColourableZebra3D/contents/docs/assets/textures");
                const data = await response.json();
                
                // Filter out _HighPoly suffixes and extract base zebra names
                const namesSet = new Set();
                data.forEach(file => {
                    if (file.name.endsWith(".jpg") || file.name.endsWith(".png")) {
                        const baseName = file.name.replace("_HighPoly.png", "").replace("_HighPoly.jpg", "").replace(".jpg", "").replace(".png", "");
                        namesSet.add(baseName);
                    }
                });

                availableZebras = Array.from(namesSet);
                populateDropdown(availableZebras);

                if (availableZebras.length > 0) {
                    selectedZebraName = availableZebras[0];
                    loadModelAndTexture();
                }
            } catch (err) {
                log("Failed to fetch GitHub texture list. Using fallback.");
                availableZebras = ["Texture_0001"];
                populateDropdown(availableZebras);
                selectedZebraName = availableZebras[0];
                loadModelAndTexture();
            }
        }

        function populateDropdown(list) {
            const select = document.getElementById("textureSelect");
            select.innerHTML = "";
            list.forEach(name => {
                const opt = document.createElement("option");
                opt.value = name;
                opt.textContent = name;
                select.appendChild(opt);
            });
            select.value = selectedZebraName;
        }

        function loadModelAndTexture() {
            if (currentMesh) {
                currentMesh.dispose();
                currentMesh = null;
            }
            if (activeAnimGroup) {
                activeAnimGroup.stop();
                activeAnimGroup = null;
            }

            const modelFile = isHighPolyMode ? "ZebraModel_HighPoly.gltf" : "ZebraModel.gltf";
            const textureFile = isHighPolyMode ? `${selectedZebraName}_HighPoly.png` : `${selectedZebraName}.jpg`;
            
            log(`Loading ${modelFile}...`);

            BABYLON.SceneLoader.ImportMesh("", "./assets/model/", `${modelFile}?v=${Date.now()}`, scene, function (meshes, particleSystems, skeletons, animationGroups) {
                currentMesh = meshes[0];
                log(`Loaded ${modelFile} successfully.`);

                // Handle Animations if High-Poly mode
                const animControls = document.getElementById("animControls");
                if (isHighPolyMode && animationGroups && animationGroups.length > 0) {
                    animControls.style.display = "block";
                    activeAnimGroup = animationGroups[0];
                    activeAnimGroup.play(true);
                } else {
                    animControls.style.display = "none";
                }

                // Apply Baked / Original Texture
                const texturePath = `./assets/textures/${textureFile}?v=${Date.now()}`;
                const mat = new BABYLON.StandardMaterial("zebraMat", scene);
                mat.diffuseTexture = new BABYLON.Texture(texturePath, scene);
                mat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);

                meshes.forEach(m => {
                    if (m.material) {
                        m.material = mat;
                    }
                });
                log(`Applied texture: ${textureFile}`);
            });
        }

        // Event Listeners
        document.getElementById("textureSelect").addEventListener("change", (e) => {
            selectedZebraName = e.target.value;
            loadModelAndTexture();
        });

        document.getElementById("searchInput").addEventListener("input", (e) => {
            const val = e.target.value.toLowerCase();
            const filtered = availableZebras.filter(z => z.toLowerCase().includes(val));
            populateDropdown(filtered);
        });

        document.getElementById("toggleModelBtn").addEventListener("click", () => {
            isHighPolyMode = !isHighPolyMode;
            const btn = document.getElementById("toggleModelBtn");
            btn.textContent = isHighPolyMode ? "Mode: High-Poly (Animated)" : "Mode: Low-Poly (Static)";
            btn.style.background = isHighPolyMode ? "#28a745" : "#444";
            loadModelAndTexture();
        });

        document.getElementById("playBtn").addEventListener("click", () => {
            if (activeAnimGroup) activeAnimGroup.play(true);
        });

        document.getElementById("pauseBtn").addEventListener("click", () => {
            if (activeAnimGroup) activeAnimGroup.pause();
        });

        engine.runRenderLoop(() => scene.render());
        window.addEventListener("resize", () => engine.resize());

        fetchTexturesList();
    </script>
</body>
</html>
