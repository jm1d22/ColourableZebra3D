<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Colourable Zebra Gallery</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            max-width: 300px;
        }
        select, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }
        select:hover, button:hover {
            background: #444;
        }
    </style>
    <!-- Babylon.js CDN Scripts -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>

    <div id="ui-container">
        <h2 style="margin: 0 0 10px 0; font-size: 18px;">Zebra Texture Viewer</h2>
        <label for="textureSelect">Select Scanned Texture:</label>
        <select id="textureSelect">
            <option value="">Loading textures...</option>
        </select>
        <button id="refreshBtn">Refresh Texture List</button>
    </div>

    <canvas id="renderCanvas"></canvas>

    <script>
        const REPO_OWNER = "jm1d22";
        const REPO_NAME = "ColourableZebra3D";
        const TEXTURE_DIR_API = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/docs/assets/textures`;
        
        let zebraMesh = null;
        let activeMaterial = null;

        // Initialize Babylon.js Scene
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.1, 0.1, 0.1, 1);

            // Camera setup
            const camera = new BABYLON.ArcRotateCamera("Camera", Math.PI / 2, Math.PI / 3, 15, BABYLON.Vector3.Zero(), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 5;
            camera.upperRadiusLimit = 30;

            // Hemisphere and Directional Lights
            const hemiLight = new BABYLON.HemisphericLight("hemiLight", new BABYLON.Vector3(0, 1, 0), scene);
            hemiLight.intensity = 0.8;

            const dirLight = new BABYLON.DirectionalLight("dirLight", new BABYLON.Vector3(-1, -2, -1), scene);
            dirLight.intensity = 0.5;

            // Base Material
            activeMaterial = new BABYLON.StandardMaterial("zebraMat", scene);
            activeMaterial.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);

            // Load Zebra 3D Model
            BABYLON.SceneLoader.ImportMesh("", "./assets/model/", "ZebraModel.gltf", scene, function (meshes) {
                if (meshes.length > 0) {
                    zebraMesh = meshes[0];
                    zebraMesh.material = activeMaterial;
                    camera.target = zebraMesh.position;
                }
            });

            return scene;
        };

        const scene = createScene();

        engine.runRenderLoop(function () {
            scene.render();
        });

        window.addEventListener("resize", function () {
            engine.resize();
        });

        // Function to apply dynamic texture to 3D model
        function applyTexture(textureUrl) {
            if (activeMaterial && textureUrl) {
                activeMaterial.diffuseTexture = new BABYLON.Texture(textureUrl, scene);
            }
        }

        // Fetch textures dynamically from GitHub repository contents API
        async function fetchTextureList() {
            const selectEl = document.getElementById("textureSelect");
            selectEl.innerHTML = "<option>Fetching textures...</option>";

            try {
                const response = await fetch(TEXTURE_DIR_API);
                if (!response.ok) throw new Error("No textures found or directory empty.");
                
                const files = await response.json();
                const jpgFiles = files.filter(file => file.name.endsWith('.jpg') || file.name.endsWith('.png'));

                selectEl.innerHTML = "";

                if (jpgFiles.length === 0) {
                    selectEl.innerHTML = "<option>No textures uploaded yet</option>";
                    return;
                }

                jpgFiles.reverse(); // Show latest uploaded texture first

                jpgFiles.forEach(file => {
                    const option = document.createElement("option");
                    option.value = file.download_url;
                    option.textContent = file.name;
                    selectEl.appendChild(option);
                });

                // Automatically load top texture
                applyTexture(jpgFiles[0].download_url);

            } catch (err) {
                console.error(err);
                selectEl.innerHTML = "<option>Error loading textures</option>";
            }
        }

        document.getElementById("textureSelect").addEventListener("change", (e) => {
            applyTexture(e.target.value);
        });

        document.getElementById("refreshBtn").addEventListener("click", fetchTextureList);

        // Initial fetch on page load
        fetchTextureList();
    </script>
</body>
</html>
